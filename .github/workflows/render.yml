name: Render Videos

on:
  workflow_dispatch:  # Allow manual triggering

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install

      - name: Set up environment variables
        run: |
          echo "SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY }}" >> .env
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env

      - name: Run render script
        run: bash render_action.sh

      - name: Check for rendered videos
        id: check-videos
        run: |
          if [ -d "out" ] && [ "$(ls -A out)" ]; then
            echo "has_videos=true" >> $GITHUB_OUTPUT
          else
            echo "No videos were rendered in this run"
            echo "has_videos=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload rendered videos
        if: steps.check-videos.outputs.has_videos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: out/*.mp4
