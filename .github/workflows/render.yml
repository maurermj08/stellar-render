name: Render Videos

on:
  schedule:
    - cron: '0 0 * * *'  # Run once a day at midnight
  workflow_dispatch:  # Allow manual triggering

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install

      - name: Set up environment variables
        run: |
          echo "SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY }}" >> .env
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env

      - name: Run render script
        run: bash render_action.sh

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos